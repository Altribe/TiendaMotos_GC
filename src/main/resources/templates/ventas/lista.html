<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historial de Ventas - TiendaMotos_GC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/menu}">
            🏍️ TiendaMotos_GC
        </a>
        <a class="btn btn-outline-light" th:href="@{/menu}">
            Volver al menú
        </a>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Historial de Ventas</h2>

        <a th:href="@{/ventas/nuevo}" class="btn btn-success">
            + Nueva Venta
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body table-responsive">

            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Documento</th>
                        <th>Número</th>
                        <th>Cliente</th>
                        <th>Dirección</th>
                        <th>Vendedor</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="venta : ${ventas}">
                        <td th:text="${venta.idVenta}"></td>

                        <td th:text="${#temporals.format(
                            venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></td>

                        <td th:text="${venta.tipoDocumento}"></td>

                        <td th:text="${venta.numDocumento}"></td>

                        <td th:text="${venta.nombreCliente}"></td>

                        <td th:text="${venta.direccionCliente}"></td>

                        <td th:text="${venta.usuario.nombreCompleto}"></td>

                        <td th:text="|S/ ${venta.total}|"
                            class="fw-bold text-success"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="8"
                            class="text-center text-muted py-4">
                            Todavía no existen ventas registradas.
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>
</body>
</html>
