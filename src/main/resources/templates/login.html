<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>TiendaMotos_GC - Iniciar Sesión</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">
	<div class="container mt-5">
		<div class="row d-flex justify-content-center">
			<div class="col-md-5">
				<div class="card shadow-lg">
					<div class="card-body p-4">
						<div class="text-center mb-4">
							<i class="fa-solid fa-motorcycle fa-3x text-primary mb-2"></i>
							<h2 class="card-title fw-bold">TiendaMotos_GC</h2>
							<p class="text-muted">Ingrese sus credenciales de acceso</p>
						</div>

						<form th:action="@{/login}" method="post">
							<div class="mb-3 position-relative">
								<label for="username" class="form-label">Usuario</label>
								<div class="input-group">
									<span class="input-group-text"><i class="fa-solid fa-user"></i></span>
									<input type="text" class="form-control" id="username" name="username" placeholder="Ingrese su usuario" required>
								</div>
							</div>

							<div class="mb-3 position-relative">
								<label for="password" class="form-label">Contraseña</label>
								<div class="input-group">
									<span class="input-group-text"><i class="fa-solid fa-key"></i></span>
									<input type="password" class="form-control" id="password" name="password" placeholder="Ingrese su contraseña" required>
								</div>
							</div>

							<div class="d-grid gap-2 mt-4">
								<button type="submit" class="btn btn-primary btn-lg">
									<i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Renderizado de Alertas SweetAlert2 o Error de Sesión -->
	<th:block th:if="${error != null}">
		<script>
			Swal.fire({
				icon: 'error',
				title: 'Error de Autenticación',
				text: '[[${error}]]',
				confirmButtonColor: '#0d6efd'
			});
		</script>
	</th:block>

	<th:block th:if="${alerta != null}">
		<div th:utext="${alerta}"></div>
	</th:block>
</body>

</html>
