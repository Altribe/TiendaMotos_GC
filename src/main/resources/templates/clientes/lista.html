<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes - TiendaMotos_GC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/menu}">
            🏍️ TiendaMotos_GC
        </a>
        <a class="btn btn-outline-light" th:href="@{/menu}">
            Volver al menú
        </a>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Registro de Clientes</h2>
        <a th:href="@{/clientes/nuevo}" class="btn btn-success">
            + Nuevo Cliente
        </a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success"
         th:text="${mensaje}"></div>

    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>DNI</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.idCliente}"></td>
                        <td th:text="${cliente.dni}"></td>
                        <td th:text="${cliente.nombres}"></td>
                        <td th:text="${cliente.apellidos}"></td>
                        <td th:text="${cliente.telefono}"></td>
                        <td th:text="${cliente.correo}"></td>

                        <td>
                            <div class="d-flex gap-2">
                                <a class="btn btn-warning btn-sm"
                                   th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}">
                                    Editar
                                </a>

                                <form th:action="@{/clientes/eliminar/{id}(id=${cliente.idCliente})}"
                                      method="post"
                                      onsubmit="return confirm('¿Eliminar este cliente?');">
                                    <button type="submit"
                                            class="btn btn-danger btn-sm">
                                        Eliminar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="7" class="text-center text-muted">
                            No hay clientes registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
