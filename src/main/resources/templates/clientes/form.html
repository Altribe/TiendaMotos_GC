<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de Clientes - TiendaMotos_GC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/menu}">
            🏍️ TiendaMotos_GC
        </a>
        <a class="btn btn-outline-light"
           th:href="@{/clientes/listar}">
            Volver a clientes
        </a>
    </div>
</nav>

<div class="container mt-4 mb-5" style="max-width: 750px;">

    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"
                th:text="${cliente.idCliente == null}
                ? 'Registrar Nuevo Cliente'
                : 'Editar Cliente'">
                Formulario de Clientes
            </h4>
        </div>

        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <form th:action="@{/clientes/guardar}"
                  th:object="${cliente}"
                  method="post">

                <input type="hidden" th:field="*{idCliente}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombres</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{nombres}"
                               maxlength="100"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellidos</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{apellidos}"
                               maxlength="100"
                               required>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">DNI</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{dni}"
                               minlength="8"
                               maxlength="8"
                               pattern="[0-9]{8}"
                               inputmode="numeric"
                               title="Ingrese exactamente 8 números"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="tel"
                               class="form-control"
                               th:field="*{telefono}"
                               maxlength="15">
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email"
                           class="form-control"
                           th:field="*{correo}"
                           maxlength="150">
                </div>

                <div class="mb-4">
                    <label class="form-label">Dirección</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{direccion}"
                           maxlength="200">
                </div>

                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/clientes/listar}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-primary">
                        Guardar Cliente
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
