<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Orden - TiendaMotos_GC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container">
    <a class="navbar-brand" th:href="@{/menu}">🏍 TiendaMotos_GC</a>
    <a class="btn btn-outline-light" th:href="@{/ordenes/listar}">Ver órdenes</a>
</div></nav>
<main class="container my-4" style="max-width:750px">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white"><h3 class="h5 m-0">Nueva orden de compra</h3></div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <p class="text-muted">El precio corresponde al <strong>costo unitario de compra</strong>, no al precio de venta.</p>
            <form th:action="@{/ordenes/guardar}" method="post">
                <div class="mb-3">
                    <label for="proveedor" class="form-label">Proveedor</label>
                    <select id="proveedor" name="idProveedor" class="form-select" required>
                        <option value="">Seleccione un proveedor</option>
                        <option th:each="p : ${proveedores}" th:value="${p.idProveedor}"
                                th:text="${p.razonSocial}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="producto" class="form-label">Producto</label>
                    <select id="producto" name="idProducto" class="form-select" required>
                        <option value="">Seleccione un producto</option>
                        <option th:each="p : ${productos}" th:value="${p.idProducto}"
                                th:attr="data-proveedor=${p.proveedor != null ? p.proveedor.idProveedor : ''}"
                                th:text="${p.nombre}"></option>
                    </select>
                    <div class="form-text">Al elegir un proveedor se mostrarán solamente sus productos.</div>
                </div>
                <div class="mb-3">
                    <label for="cantidad" class="form-label">Cantidad solicitada</label>
                    <input id="cantidad" name="cantidad" type="number" min="1" step="1" required class="form-control">
                </div>
                <div class="mb-3">
                    <label for="precioCompra" class="form-label">Precio de compra por unidad (S/)</label>
                    <input id="precioCompra" name="precioCompra" type="number" min="0.01" step="0.01" required class="form-control">
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/ordenes/listar}" class="btn btn-secondary">Cancelar</a>
                    <button class="btn btn-primary" type="submit">Guardar orden pendiente</button>
                </div>
            </form>
        </div>
    </div>
</main>
<script>
    const proveedor = document.getElementById('proveedor');
    const producto = document.getElementById('producto');
    function filtrarProductos() {
        const id = proveedor.value;
        [...producto.options].forEach(option => {
            if (!option.value) return;
            option.hidden = !id || option.dataset.proveedor !== id;
            option.disabled = option.hidden;
        });
        producto.value = '';
    }
    proveedor.addEventListener('change', filtrarProductos);
    filtrarProductos();
</script>
</body>
</html>
