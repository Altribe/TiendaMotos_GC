<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Órdenes de Compra - TiendaMotos_GC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container">
    <a class="navbar-brand" th:href="@{/menu}">🏍 TiendaMotos_GC</a>
    <a class="btn btn-outline-light" th:href="@{/menu}">Volver al menú</a>
</div></nav>
<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Órdenes de Compra</h2>
        <a class="btn btn-success" th:href="@{/ordenes/nueva}">+ Nueva orden</a>
    </div>
    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="card shadow-sm"><div class="card-body table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark"><tr>
                <th>ID</th><th>Fecha</th><th>Proveedor</th><th>Producto</th>
                <th>Cantidad</th><th>Monto (S/)</th><th>Estado</th><th>Acciones</th>
            </tr></thead>
            <tbody>
                <tr th:each="orden : ${ordenes}">
                    <td th:text="${orden.idOrden}"></td>
                    <td th:text="${#temporals.format(orden.fechaOrden, 'dd/MM/yyyy')}"></td>
                    <td th:text="${orden.proveedor.razonSocial}"></td>
                    <td th:text="${orden.producto.nombre}"></td>
                    <td th:text="${orden.cantidad}"></td>
                    <td th:text="${#numbers.formatDecimal(orden.montoTotal,1,2)}"></td>
                    <td>
                        <span th:if="${orden.estado == 'P'}" class="badge bg-warning text-dark">Pendiente</span>
                        <span th:if="${orden.estado == 'C'}" class="badge bg-success">Completado</span>
                        <span th:if="${orden.estado == 'A'}" class="badge bg-secondary">Anulado</span>
                    </td>
                    <td>
                        <div th:if="${orden.estado == 'P'}" class="d-flex gap-2">
                            <form th:action="@{/ordenes/completar}" method="post"
                                  onsubmit="return confirm('¿Confirmas que recibiste las unidades y deseas aumentar el stock?');">
                                <input type="hidden" name="idOrden" th:value="${orden.idOrden}">
                                <button type="submit" class="btn btn-success btn-sm">Completar</button>
                            </form>
                            <form th:action="@{/ordenes/anular}" method="post"
                                  onsubmit="return confirm('¿Anular esta orden?');">
                                <input type="hidden" name="idOrden" th:value="${orden.idOrden}">
                                <button type="submit" class="btn btn-outline-danger btn-sm">Anular</button>
                            </form>
                        </div>
                        <span th:unless="${orden.estado == 'P'}" class="text-muted">Sin acciones</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ordenes)}">
                    <td colspan="8" class="text-center text-muted">No existen órdenes registradas.</td>
                </tr>
            </tbody>
        </table>
    </div></div>
</main>
</body>
</html>
