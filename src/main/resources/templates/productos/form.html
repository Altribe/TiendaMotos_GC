<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Formulario de Moto / Compra - TiendaMotos_GC</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/menu}">
                <i class="fa-solid fa-motorcycle text-warning"></i> TiendaMotos_GC
            </a>
            <div class="d-flex align-items-center text-white">
                <a th:href="@{/productos/listar}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver al Inventario</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white fw-bold fs-5">
                <i class="fa-solid fa-file-signature"></i> 
                <span th:text="${producto.idProducto == null ? 'Agregar Stock / Nueva Compra' : 'Editar Datos de Producto y Compra'}"></span>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                    
                    <input type="hidden" th:field="*{idProducto}" />

                    <!-- Sección 1: Datos de la Motocicleta -->
                    <h5 class="text-primary border-bottom pb-2 mb-3"><i class="fa-solid fa-motorcycle"></i> Datos de la Motocicleta</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nombre / Modelo de la Moto:</label>
                            <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej. Pulsar NS200 FI" required />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Precio Público Venta (S/):</label>
                            <input type="number" step="0.01" id="precioVenta" th:field="*{precio}" class="form-control" placeholder="0.00" required />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Categoría:</label>
                            <select th:field="*{categoria.idCategoria}" class="form-select" required>
                                <option value="">-- Seleccionar --</option>
                                <option th:each="c : ${categorias}" 
                                        th:value="${c.idCategoria}" 
                                        th:text="${c.denominacion}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- Sección 2: Datos del Proveedor y Compra de Stock -->
                    <h5 class="text-success border-bottom pb-2 mb-3"><i class="fa-solid fa-truck-field"></i> Datos del Proveedor y Compra</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Seleccionar Proveedor Registrado:</label>
                            <div class="input-group">
                                <select th:field="*{proveedor.idProveedor}" id="selectProveedor" class="form-select" required onchange="actualizarDatosProveedor()">
                                    <option value="">-- Seleccione Proveedor --</option>
                                    <option th:each="p : ${proveedores}" 
                                            th:value="${p.idProveedor}" 
                                            th:data-ruc="${p.ruc}" 
                                            th:data-direccion="${p.direccion}" 
                                            th:text="${p.razonSocial}">
                                    </option>
                                </select>
                                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevoProveedor" title="Registrar Nuevo Proveedor">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">RUC del Proveedor:</label>
                            <input type="text" id="rucProveedor" class="form-control" placeholder="Ingrese RUC" readonly />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Dirección del Proveedor:</label>
                            <input type="text" id="direccionProveedor" class="form-control" placeholder="Ingrese Dirección" readonly />
                        </div>
                    </div>

                    <!-- Sección 3: Cálculo de Compra y Stock -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Cantidad Comprada (Stock):</label>
                            <input type="number" id="cantidadComprada" th:field="*{stock}" class="form-control" min="1" required oninput="calcularTotalCompra()" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Precio de Compra Unitario (S/):</label>
                            <input type="number" step="0.01" id="precioCompra" class="form-control" placeholder="Precio al que se compró" oninput="calcularTotalCompra()" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-success">Precio Total de Compra (S/):</label>
                            <input type="text" id="totalCompra" class="form-control bg-light fw-bold text-success fs-5" readonly placeholder="S/ 0.00" />
                        </div>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/productos/listar}" class="btn btn-secondary">
                            <i class="fa-solid fa-xmark"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary fw-bold">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar Moto / Stock
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal para Registrar Nuevo Proveedor -->
    <div class="modal fade" id="modalNuevoProveedor" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-truck"></i> Registrar Nuevo Proveedor</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/proveedores/guardar-modal}" method="post">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold">RUC (11 dígitos):</label>
                            <input type="text" name="ruc" class="form-control" maxlength="11" placeholder="Ej. 20123456789" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Razón Social:</label>
                            <input type="text" name="razonSocial" class="form-control" placeholder="Ej. MotorParts S.A.C." required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Dirección:</label>
                            <input type="text" name="direccion" class="form-control" placeholder="Ej. Av. Industrial 500" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Teléfono:</label>
                            <input type="text" name="telefono" class="form-control" placeholder="Ej. 01-555-1234" />
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success fw-bold"><i class="fa-solid fa-floppy-disk"></i> Guardar Proveedor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Renderizado de Alertas SweetAlert2 (al guardar desde el modal) -->
    <th:block th:if="${alerta != null}">
        <div th:utext="${alerta}"></div>
    </th:block>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function actualizarDatosProveedor() {
            const select = document.getElementById("selectProveedor");
            const selectedOption = select ? select.options[select.selectedIndex] : null;
            
            const ruc = selectedOption ? selectedOption.getAttribute("data-ruc") || "" : "";
            const direccion = selectedOption ? selectedOption.getAttribute("data-direccion") || "" : "";
            
            document.getElementById("rucProveedor").value = ruc;
            document.getElementById("direccionProveedor").value = direccion;
        }

        function calcularTotalCompra() {
            const cantidad = parseFloat(document.getElementById("cantidadComprada").value) || 0;
            const precioUnitario = parseFloat(document.getElementById("precioCompra").value) || 0;
            const total = cantidad * precioUnitario;
            
            document.getElementById("totalCompra").value = "S/ " + total.toFixed(2);
        }

        document.addEventListener("DOMContentLoaded", function() {
            actualizarDatosProveedor();
            calcularTotalCompra();
        });
    </script>
</body>
</html>
